<text x="734" y="674" class="body">Business semantics,</text>
<text x="734" y="706" class="body">entities, relationships,</text>
<text x="734" y="738" class="body">invariants and context</text>
<text x="734" y="770" class="body">boundaries</text>
<path d="M550 836 V873 m-15-15 15 15 15-15" class="arrow"/>
<!-- Agentic harness -->
<rect x="64" y="890" width="972" height="153" rx="25" class="box"/>
<line x1="246" y1="907" x2="246" y2="1024" stroke="#111" stroke-width="2"/>
<rect x="110" y="932" width="89" height="69" rx="20" class="icon"/>
<circle cx="136" cy="965" r="5" fill="#111"/><circle cx="173" cy="965" r="5" fill="#111"/>
<path d="M135 983 q20 15 39 0 M154 932 v-16 M153 916 a6 6 0 1 0 0-12 a6 6 0 1 0 0 12" class="icon"/>
<rect x="264" y="908" width="753" height="53" rx="8" class="header"/>
<text x="285" y="946" class="section">Agentic Harness</text>
<text x="285" y="993" class="body">Bounded planning · Tool execution · Policy gates ·</text>
<text x="285" y="1023" class="body">Independent verification</text>
<path d="M550 1047 V1084 m-15-15 15 15 15-15" class="arrow"/>
<!-- Verified outcome -->
<rect x="64" y="1100" width="972" height="153" rx="25" class="box"/>
<line x1="246" y1="1117" x2="246" y2="1234" stroke="#111" stroke-width="2"/>
<circle cx="155" cy="1175" r="45" class="icon"/><path d="M128 1173 l20 20 36-43" class="icon"/>
<rect x="264" y="1118" width="753" height="53" rx="8" class="header"/>
<text x="285" y="1156" class="section">Verified business outcome</text>
<text x="285" y="1203" class="body">Correct schedule · No duplicate debit · Traceable</text>
<text x="285" y="1232" class="body">decision · Customer notified</text>
<!-- Four lenses -->
<rect x="28" y="1282" width="1044" height="113" rx="18" class="box"/>
<rect x="28" y="1282" width="207" height="113" rx="18" fill="#222"/>
<text x="47" y="1321" class="label" style="fill:#fff">Evaluated</text><text x="47" y="1350" class="label" style="fill:#fff">through the</text><text x="47" y="1379" class="label" style="fill:#fff">Four Lenses</text>
<g>
<rect x="250" y="1298" width="196" height="79" rx="12" class="box"/>
<text x="271" y="1330" class="label">Ontology</text><text x="271" y="1357" class="small">Meaningful</text>
<rect x="454" y="1298" width="204" height="79" rx="12" class="box"/>
<text x="472" y="1330" class="label">Epistemology</text><text x="472" y="1357" class="small">Trustworthy</text>
<rect x="666" y="1298" width="167" height="79" rx="12" class="box"/>
<text x="685" y="1330" class="label">Axiology</text><text x="685" y="1357" class="small">Governed</text>
<rect x="841" y="1298" width="216" height="79" rx="12" class="box"/>
<text x="855" y="1330" class="label">Phenomenology</text><text x="855" y="1357" class="small">Useful</text>
</g>
<text x="550" y="1441" font-size="27" font-weight="700" text-anchor="middle">Context engineering makes application modernisation</text>
<text x="550" y="1475" font-size="27" font-weight="700" text-anchor="middle">repeatable, explainable and verifiable.</text>
<line x1="30" y1="1494" x2="1070" y2="1494" stroke="#111" stroke-width="2"/>
<text x="550" y="1525" font-size="17" text-anchor="middle">Four Lenses of Banking Modernisation | Deenadayaalan Thirugnanasambandam | Independent professional viewpoint | v1.1</text>
