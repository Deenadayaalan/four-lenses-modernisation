<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">The Four Lenses of Modernisation — publication cover</title>
<desc id="desc">A restrained black-and-white cover: Business Intent leads to Context Engineering supported by Data Harness and Ontology DDD, a Configurable Agentic SDLC, Independent Verification and Human Review, then Verified Outcomes. The Four Lenses apply throughout.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#111"/></marker></defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif;fill:#111}.sans{font-family:Arial,Helvetica,sans-serif;fill:#111}.major{font-size:43px;font-weight:700}.detail{font-size:26px}.small{font-size:21px}.frame{stroke:#111;stroke-width:2.8;fill:#fff}.light{stroke:#111;stroke-width:2;fill:#f5f5f5}.line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}.gray{fill:#444}
</style>
