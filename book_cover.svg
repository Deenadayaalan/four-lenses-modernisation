<rect x="135" y="603" width="930" height="104" rx="15" class="frame"/>
<text class="sans major" x="600" y="649" text-anchor="middle">CONTEXT ENGINEERING</text>
<text class="sans detail" x="600" y="687" text-anchor="middle">Trusted evidence and business meaning</text>
